<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    /* =========================================
       1. 全局佈局 (Layout)
       ========================================= */
    :root {
      --sidebar-width: 260px;
      --header-height: 60px; /* 僅用於手機版頂部 */
      --panel-dark: #17202a;
      --border-dark: #2b313a;
    }
    
    body {
      margin: 0;
      background: #0f1318;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; /* 讓 body 變成左右佈局 */
      min-height: 100vh;
    }

    /* =========================================
       2. 左側側邊欄 (Sidebar)
       ========================================= */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--panel-dark);
      border-right: 1px solid var(--border-dark);
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      overflow-y: auto; /* 內容過多時可捲動 */
    }

    /* 側邊欄 Logo 區 */
    .sidebar-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-dark);
    }
    .brand {
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      height: 50px;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
    }

    /* 側邊欄導覽區 */
    .sidebar-nav {
      padding: 20px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 側邊欄按鈕樣式 */
    .nav-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      text-decoration: none;
      width: 100%;
    }
    .nav-btn i {
      font-size: 18px;
      color: #64748b;
      transition: color 0.2s;
    }
    .nav-btn:hover {
      background: #1e293b;
      color: #fff;
    }
    .nav-btn:hover i {
      color: #60a5fa; /* 懸停時 Icon 變藍 */
    }
    
    /* 特別樣式：Premium 按鈕 */
    .btn-premium-sidebar {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff !important;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      justify-content: center;
      font-weight: 700;
    }
    .btn-premium-sidebar:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }
    .btn-premium-sidebar i { color: #fff !important; }

    /* 特別樣式：股票按鈕 */
    .btn-stock {
      border: 1px solid #334155;
    }

    /* 分隔線 */
    .nav-divider {
      height: 1px;
      background: var(--border-dark);
      margin: 8px 0;
    }
    .nav-label {
      font-size: 12px;
      color: #475569;
      font-weight: 700;
      text-transform: uppercase;
      padding: 12px 16px 4px;
      letter-spacing: 0.5px;
    }

    /* =========================================
       3. 主內容區 (Main Content)
       ========================================= */
    .main-content {
      margin-left: var(--sidebar-width); /* 留出側邊欄空間 */
      width: calc(100% - var(--sidebar-width));
      min-height: 100vh;
      position: relative;
    }

    /* 背景漸層 (現在只作用在 main-content) */
    .gradient-wrap {
      background: linear-gradient(135deg,
        #1e3a8a 0%, #2563eb 20%, #7e22ce 40%, #db2777 60%, #f97316 80%, #fde047 100%
      );
      background-size: 300% 300%;
      animation: gradientShift 10s ease-in-out infinite;
      min-height: 100vh; /* 滿版 */
      padding: 40px 20px 100px; /* 下方留空給 FAB */
      box-sizing: border-box;
    }
    @keyframes gradientShift{
      0%{ background-position: 0% 50%; } 50%{ background-position: 100% 50%; } 100%{ background-position: 0% 50%; }
    }

    /* =========================================
       4. 手機版適配 (Mobile)
       ========================================= */
    .mobile-header {
      display: none; /* 桌機隱藏 */
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-height);
      background: rgba(23, 32, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-dark);
      z-index: 60;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    
    .hamburger {
      width: 40px; height: 40px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* 遮罩 (手機版打開側邊欄時顯示) */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 40;
      backdrop-filter: blur(3px);
    }

    @media (max-width: 768px) {
      .mobile-header { display: flex; }
      
      /* 手機版側邊欄預設隱藏 (往左推) */
      .sidebar {
        transform: translateX(-100%);
        width: 280px; /* 手機版稍寬 */
        box-shadow: 5px 0 20px rgba(0,0,0,0.5);
      }
      /* 打開狀態 */
      .sidebar.open { transform: translateX(0); }
      
      /* 顯示遮罩 */
      .sidebar-overlay.show { display: block; }

      /* 主內容不留邊距，因為側邊欄是浮動的 */
      .main-content {
        margin-left: 0;
        width: 100%;
        padding-top: var(--header-height); /* 留出頂部 Header 空間 */
      }
      .gradient-wrap {
        min-height: calc(100vh - var(--header-height));
      }
    }

    /* =========================================
       5. 卡片與元件樣式 (保留您原本的設計)
       ========================================= */
    .dashboard-card, .gradient-wrap .card.hero, .gradient-wrap .hero-card, .gradient-wrap #hero,
    .gradient-wrap #app > .card:first-of-type, .gradient-wrap main > .card:first-of-type{
      background: linear-gradient(145deg, #0f172a, #1e293b) !important;
      border: 2px solid transparent;
      border-image: linear-gradient(90deg, #60a5fa, #a855f7, #f472b6) 1;
      border-radius: 14px; padding: 22px; color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45); transition: all .3s ease;
    }
    .dashboard-card:hover, .gradient-wrap .card.hero:hover{
      transform: translateY(-4px); box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    }
    .dashboard-card h1, .gradient-wrap .card.hero h1{
      background: linear-gradient(90deg, #60a5fa, #a855f7, #f472b6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-size: 1.8rem; font-weight: 800; margin: 0 0 .4rem 0;
    }
    .gradient-wrap .card{
      box-shadow: 0 3px 12px rgba(0,0,0,0.35);
      transition: transform .25s ease, box-shadow .25s ease;
      border-radius: 14px;
    }
    .gradient-wrap .card:hover{
      transform: translateY(-3px); box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    }

    /* Modal 樣式 */
    .modal-mask{ position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(4px); }
    .modal-mask.show{ display: flex; }
    .modal-card{ width: min(560px, 92vw); background: #ffffff; color:#111; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
    .modal-hd{ padding:16px 20px; background:#f5f7fb; font-weight:700; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; }
    .modal-bd{ padding:20px; background:#fff; }
    .modal-ft{ padding:14px 20px; background:#f5f7fb; border-top:1px solid #e5e7eb; display:flex; gap:10px; justify-content:flex-end; }
    
    /* 表單元件 */
    .form-ctl{ width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; margin-top:4px; }
    .btn-primary{ background:#2563eb; color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; }
    .btn-line{ background:#fff; border:1px solid #cbd5e1; padding:8px 16px; border-radius:8px; cursor:pointer; }

    /* Pricing Grid */
    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top:10px; }
    .pricing-card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; text-align: center; }
    .pricing-card.featured { border: 2px solid #3b82f6; background: linear-gradient(to bottom right, #eff6ff, #fff); position: relative; }
    .badge-feature { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #2563eb; color: #fff; font-size: 12px; padding: 4px 12px; border-radius: 99px; font-weight: bold; }
    .btn-pricing { display: block; width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; margin-top:16px; }
    .btn-pricing.primary { background: linear-gradient(135deg,#2563eb,#60a5fa); color: #fff; }
    .btn-pricing.ghost { background: #e2e8f0; color: #475569; }

    /* Checkout Modal */
    #checkoutModal .modal-card { width: min(900px, 94vw); background: #1e293b; border: 1px solid #334155; color: #fff; }
    .checkout-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; }
    .form-side { padding: 30px; }
    .summary-side { background: #0f172a; padding: 30px; border-left: 1px solid #334155; }
    @media (max-width: 768px) { .checkout-layout { grid-template-columns: 1fr; } .summary-side { order: -1; border-left:none; border-bottom:1px solid #334155; } }
    .ck-input { background:#0f172a; border:1px solid #475569; color:#fff; width:100%; padding:10px; border-radius:8px; }
    .btn-pay { width:100%; background: linear-gradient(90deg, #2563eb, #4f46e5); border:none; padding:12px; border-radius:8px; color:#fff; font-weight:700; cursor:pointer; margin-top:20px; }

    /* 彩色卡片樣式 */
    .st-colored-card{ border-radius: 16px; padding: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.35); color:#fff; transition: transform .2s; }
    .st-colored-card:hover{ transform: translateY(-4px); }
    .st-g1{ background: linear-gradient(135deg,#2563eb,#60a5fa); }
    .st-g2{ background: linear-gradient(135deg,#10b981,#34d399); }
    .st-g3{ background: linear-gradient(135deg,#f59e0b,#fbbf24); color:#1f2937; }
    .st-g4{ background: linear-gradient(135deg,#9333ea,#c084fc); }
    .st-g5{ background: linear-gradient(135deg,#db2777,#f472b6); }
    .st-g6{ background: linear-gradient(135deg,#0ea5e9,#22d3ee); }
    .st-g7{ background: linear-gradient(135deg,#ef4444,#f97316); }
    .st-g8{ background: linear-gradient(135deg,#14b8a6,#84cc16); }
  </style>

<script>
function parseGoogleJWT(credential){
  const base64Url = credential.split('.')[1];
  const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
  const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}
window.__showWelcomeInAuth = function(name){
  let slot = document.getElementById('welcome-slot');
  if(!slot){
    const card = document.querySelector('#auth-card');
    if(card){ slot = document.createElement('div'); slot.id = 'welcome-slot'; card.insertBefore(slot, card.firstChild.nextSibling); }
  }
  if(slot){ slot.innerHTML = `<div class="welcome-chip">👋 歡迎 ${name}</div>`; }
};
function handleCredentialResponse(res){
  try{
    const payload = parseGoogleJWT(res.credential);
    const user = { email: payload.email, name: payload.name, picture: payload.picture, sub: payload.sub };
    localStorage.setItem('session_user', JSON.stringify(user));
    try{ google.accounts.id.cancel(); }catch(e){}
    window.__showWelcomeInAuth && window.__showWelcomeInAuth(user.name);
    if(location.hash !== '#auth'){ location.hash = '#dashboard'; }
  }catch(e){ console.error(e); }
}
function initGoogle(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  google.accounts.id.initialize({
    client_id: "225238850447-tds4p75o2nsforov086amnrj1nha7tuh.apps.googleusercontent.com",
    callback: handleCredentialResponse,
    auto_select: false, cancel_on_tap_outside: true
  });
  window.__renderGoogleBtn = function(){
    const mount = document.getElementById('googleBtnMount') || document.querySelector('.g_id_signin');
    if(mount){ google.accounts.id.renderButton(mount, { theme: "outline", size: "large" }); }
  };
  function refreshAuthUI(){
    let user = null; try{ user = JSON.parse(localStorage.getItem('session_user')||'null'); }catch{}
    if(location.hash === '#auth'){
      if(user && user.name){ window.__showWelcomeInAuth && window.__showWelcomeInAuth(user.name); }
      else{ window.__renderGoogleBtn && window.__renderGoogleBtn(); }
    }
  }
  refreshAuthUI();
  window.addEventListener('hashchange', refreshAuthUI);
}
window.addEventListener('load', () => {
  const ready = () => initGoogle();
  if(window.google && google.accounts && google.accounts.id){ ready(); }
  else{
    let tries = 0; const timer = setInterval(()=>{ tries++; if(window.google && google.accounts && google.accounts.id){ clearInterval(timer); ready(); } else if(tries>50){ clearInterval(timer); } },100);
  }
});
</script>

<script>
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js'); }

  /* ===== Modal 邏輯 ===== */
  function closeModal(id){ document.getElementById(id).classList.remove('show'); }
  document.getElementById('btnContact').addEventListener('click', ()=> {
    // 手機版點擊選單項目後，通常希望關閉側邊欄
    if(window.innerWidth <= 768) closeMobileMenu();
    document.getElementById('contactModal').classList.add('show');
  });
  document.getElementById('contactForm').addEventListener('submit', function(){
    setTimeout(()=>{ closeModal('contactModal'); alert('已送出！'); }, 50);
  });

  /* Premium & Checkout */
  const premiumModal = document.getElementById('premiumModal');
  const checkoutModal = document.getElementById('checkoutModal');
  window.openPremiumModal = function(){ 
    if(window.innerWidth <= 768) closeMobileMenu();
    premiumModal.classList.add('show'); 
  }
  window.closePremiumModal = function(){ premiumModal.classList.remove('show'); }
  
  window.openCheckoutModal = function(plan){
    window.closePremiumModal();
    const ckName = document.getElementById('ckPlanName');
    const ckPrice = document.getElementById('ckPlanPrice');
    const ckBtn = document.getElementById('ckBtnPrice');
    if(plan==='enterprise'){ ckName.textContent='企業版'; ckPrice.textContent='$299'; ckBtn.textContent='$299'; }
    else{ ckName.textContent='專業版 PRO'; ckPrice.textContent='$90'; ckBtn.textContent='$90'; }
    checkoutModal.classList.add('show');
  }
  window.closeCheckoutModal = function(){ checkoutModal.classList.remove('show'); }

  document.getElementById('paymentForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('.btn-pay');
    btn.disabled=true; btn.innerHTML='處理中...'; btn.style.opacity='0.7';
    setTimeout(()=>{
      btn.innerHTML='✅ 成功！'; btn.style.background='#10b981';
      localStorage.setItem('site_subscription', 'pro');
      setTimeout(()=>{ alert('權限已開通！'); window.closeCheckoutModal(); if(location.hash==='#auth')location.reload(); btn.disabled=false; btn.innerHTML=`確認付款 <span id="ckBtnPrice">${document.getElementById('ckPlanPrice').textContent}</span>`; btn.style.background='linear-gradient(90deg,#2563eb,#4f46e5)'; btn.style.opacity='1'; }, 500);
    }, 1500);
  });

  /* ===== 自動上色 (保留) ===== */
  window.applyCardColors = function() {
    const container = document.querySelector('.gradient-wrap');
    if(!container) return;
    const selectors = ['.card', '.panel', '.box', '.kcard'];
    const all = container.querySelectorAll(selectors.join(','));
    if(!all.length) return;
    const gradients = ['st-g1','st-g2','st-g3','st-g4','st-g5','st-g6','st-g7','st-g8'];
    let idx = 0;
    all.forEach((el, i)=>{
      if(i === 0) return; if(el.classList.contains('keep-dark')) return;
      const hasColor = gradients.some(g => el.classList.contains(g));
      if (hasColor) return;
      el.classList.add('st-colored-card', gradients[idx % gradients.length]);
      idx++;
    });
  };

  /* ===== 手機版側邊欄控制 (Mobile Sidebar) ===== */
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  function openMobileMenu() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('show');
  }
  function closeMobileMenu() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('show');
  }

  mobileMenuBtn.addEventListener('click', openMobileMenu);
  sidebarOverlay.addEventListener('click', closeMobileMenu);

  // 點擊任何側邊欄內的按鈕後，自動關閉側邊欄 (僅手機)
  sidebar.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        closeMobileMenu();
      }
    });
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
      closeMobileMenu(); // 恢復桌機版狀態
    }
  });
</script>
</body>
</html>
