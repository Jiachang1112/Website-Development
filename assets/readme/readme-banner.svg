<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="t d">
  <title id="t">SuperTool Website-Development</title>
  <desc id="d">記帳、股票、線上購物、OCR 拍照記帳與後台管理的 PWA</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.55" stop-color="#1b2a5e"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050a1f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="450" fill="url(#bg)"/>
  <rect width="1280" height="450" fill="url(#dots)"/>
  <circle cx="1170" cy="40" r="190" fill="#8b5cf6" opacity="0.35"/>
  <circle cx="90" cy="430" r="150" fill="#f2b705" opacity="0.25"/>
  <circle cx="1230" cy="420" r="120" fill="#22c1c3" opacity="0.28"/>

  <g filter="url(#shadow)">
    <rect x="70" y="56" width="1140" height="338" rx="22" fill="#fdfdfb"/>
  </g>
  <rect x="70" y="56" width="1140" height="8" rx="4" fill="url(#bar)"/>
  <circle cx="106" cy="130" r="7" fill="#e2e5ee"/>
  <circle cx="106" cy="196" r="7" fill="#e2e5ee"/>
  <circle cx="106" cy="262" r="7" fill="#e2e5ee"/>

  <rect x="150" y="104" width="408" height="84" rx="6" fill="#ffe56a"/>
  <text x="162" y="168" font-family="'Noto Serif TC','Noto Serif CJK TC','Songti TC','PMingLiU',serif" font-size="66" font-weight="900" fill="#101a3d">SuperTool</text>

  <text x="152" y="228" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#4a5163">記帳  ・  股票中心  ・  線上購物  ・  拍照記帳 OCR  ・  後台</text>

  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="600">
    <rect x="152" y="258" width="134" height="40" rx="20" fill="#2d6cdf"/>
    <text x="219.0" y="284" text-anchor="middle" fill="#ffffff">📒 雲端記帳</text>
    <rect x="300" y="258" width="134" height="40" rx="20" fill="#0b7a5c"/>
    <text x="367.0" y="284" text-anchor="middle" fill="#ffffff">📈 股票中心</text>
    <rect x="448" y="258" width="134" height="40" rx="20" fill="#f2b705"/>
    <text x="515.0" y="284" text-anchor="middle" fill="#101a3d">🛒 線上購物</text>
    <rect x="596" y="258" width="134" height="40" rx="20" fill="#8b5cf6"/>
    <text x="663.0" y="284" text-anchor="middle" fill="#ffffff">📷 拍照記帳</text>
  </g>
  <text x="152" y="350" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#7a8194">HTML ‧ CSS ‧ JavaScript ‧ Firebase ‧ Supabase　PWA，GitHub Actions 自動部署</text>

  <g transform="translate(878 112)">
    <rect x="40" y="0" width="190" height="236" rx="28" fill="#0f172a" stroke="#0b1230" stroke-width="5"/>
    <rect x="54" y="16" width="162" height="204" rx="16" fill="#16213f"/>
    <rect x="68" y="30" width="70" height="12" rx="6" fill="#5b8cff"/>
    <rect x="68" y="50" width="110" height="8" rx="4" fill="#33466f"/>
    <rect x="70" y="150" width="22" height="46" rx="4" fill="#22c55e"/>
    <rect x="100" y="126" width="22" height="70" rx="4" fill="#5b8cff"/>
    <rect x="130" y="100" width="22" height="96" rx="4" fill="#f59e0b"/>
    <rect x="160" y="136" width="22" height="60" rx="4" fill="#8b5cf6"/>
    <path d="M68 118 L100 92 L130 104 L182 66" fill="none" stroke="#ffe56a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="214" cy="190" r="34" fill="#f2b705" stroke="#8a6a00" stroke-width="5"/>
    <text x="214" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#6b4f00">$</text>
  </g>
</svg>
