<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperTool｜記帳</title>
  <link rel="icon" href="assets/img/supertool-favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
  <style>
    /* =========================================
       1. 全局與側邊欄佈局 (從 index.html 移植)
       ========================================= */
    :root {
      --sidebar-width: 260px;
      --header-height: 60px;
      --panel-dark: #17202a;
      --border-dark: #2b313a;
    }
    body {
      margin: 0;
      background: #0f1318;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; /* 左右佈局 */
      min-height: 100vh;
      color: #fff;
    }

    /* 側邊欄 Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--panel-dark);
      border-right: 1px solid var(--border-dark);
      height: 100vh;
      position: fixed; left: 0; top: 0; z-index: 50;
      display: flex; flex-direction: column;
      transition: transform 0.3s ease;
      overflow-y: auto;
    }
    .sidebar-header { padding: 20px; display: flex; align-items: center; border-bottom: 1px solid var(--border-dark); }
    .brand { color: #fff; text-decoration: none; font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 12px; }
    .brand img { height: 32px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
    .sidebar-nav { padding: 20px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    
    .nav-btn {
      background: transparent; border: none; color: #94a3b8;
      padding: 12px 16px; border-radius: 12px; cursor: pointer;
      text-align: left; font-size: 15px; font-weight: 500;
      display: flex; align-items: center; gap: 12px;
      transition: all 0.2s; text-decoration: none; width: 100%;
    }
    .nav-btn i { font-size: 18px; color: #64748b; transition: color 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: #1e293b; color: #fff; }
    .nav-btn:hover i, .nav-btn.active i { color: #60a5fa; }
    
    .btn-premium-sidebar {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff !important; margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      justify-content: center; font-weight: 700;
    }
    /* 修正：讓鑽石圖示顏色也變成白色 */
    .btn-premium-sidebar i { color: #fff !important; }

    .nav-divider { height: 1px; background: var(--border-dark); margin: 8px 0; }
    .nav-label { font-size: 12px; color: #475569; font-weight: 700; text-transform: uppercase; padding: 12px 16px 4px; letter-spacing: 0.5px; }

    /* 主內容區 */
    .main-content {
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      min-height: 100vh;
    }

    /* 背景漸層 (保留原本的動畫) */
    .gradient-wrap{
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 20%, #7e22ce 40%, #db2777 60%, #f97316 80%, #fde047 100%);
      background-size: 300% 300%;
      animation: gradientShift 10s ease-in-out infinite;
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
      display: flex; justify-content: center; /* 內容置中 */
    }
    @keyframes gradientShift{ 0%{ background-position: 0% 50%; } 50%{ background-position: 100% 50%; } 100%{ background-position: 0% 50%; } }

    /* 手機版 Header */
    .mobile-header {
      display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
      background: rgba(23, 32, 42, 0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-dark); z-index: 60;
      align-items: center; justify-content: flex-end; /* 修改：只保留漢堡選單靠右 */
      padding: 0 16px;
    }
    /* 修改：隱藏 mobile-header 中的 brand 標誌 */
    .mobile-header .brand { display: none; } 

    .hamburger { width: 40px; height: 40px; background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; backdrop-filter: blur(3px); }

    @media (max-width: 768px) {
      .mobile-header { display: flex; }
      .sidebar { transform: translateX(-100%); width: 280px; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.show { display: block; }
      .main-content { margin-left: 0; width: 100%; padding-top: var(--header-height); }
    }

    /* =========================================
       2. 頁面內容樣式 (保留原 book.html 樣式)
       ========================================= */
    .wrap { max-width: 1000px; width: 100%; }
    h1 {
      font-size: 2rem; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(90deg,#60a5fa,#a855f7,#f472b6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .muted { color: #f1f5f9; opacity: 0.9; margin-bottom: 28px; font-size: 1rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; }
    
    .card {
      border-radius: 18px; padding: 28px; cursor: pointer; color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
      transition: transform .25s ease, box-shadow .25s ease; border: none;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    
    /* 靜態漸層色 (移植自 index.html) */
    .st-g1{ background: linear-gradient(135deg,#2563eb,#60a5fa); }
    .st-g4{ background: linear-gradient(135deg,#9333ea,#c084fc); }
    .st-g5{ background: linear-gradient(135deg,#db2777,#f472b6); }

    .icon { width: 40px; height: 40px; margin-bottom: 14px; color: #ffffff; opacity: 0.85; }
    .title { font-weight: 700; margin-bottom: 8px; font-size: 1.3rem; color: #fff; }
    .desc { color: #e2e8f0; font-size: .95rem; line-height: 1.5; }

    /* Modal 相關樣式 (隱藏) - 僅為了讓按鈕不報錯，不顯示內容 */
    .modal-mask { display: none; } 
  </style>
</head>

<body>
  <header class="mobile-header">
    <button class="hamburger" id="mobileMenuBtn"><i class="bi bi-list"></i></button>
  </header>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html#dashboard" class="brand">
        <img src="assets/img/supertool-logo.png" alt="SuperTool">
        SuperTool
      </a>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn btn-premium-sidebar" onclick="location.href='index.html'">
        <i class="bi bi-gem"></i> Get Premium
      </button>

      <div class="nav-label">主選單</div>
      <a href="index.html#dashboard" class="nav-btn"><i class="bi bi-grid-fill"></i> 首頁</a>
      <a href="index.html#auth" class="nav-btn"><i class="bi bi-person-circle"></i> 帳號</a>

      <div class="nav-divider"></div>
      <div class="nav-label">財務管理</div>
      
      <a href="book.html" class="nav-btn active"><i class="bi bi-journal-plus"></i> 記帳</a>
      <a href="admin/accounting-settings.html#ledgers" class="nav-btn"><i class="bi bi-wallet2"></i> 我的帳本</a>
      <a href="index.html#acct_detail" class="nav-btn"><i class="bi bi-list-task"></i> 明細查詢</a>
      <a href="index.html#acct_analysis" class="nav-btn"><i class="bi bi-pie-chart-fill"></i> 報表分析</a>

      <div class="nav-divider"></div>
      <div class="nav-label">工具與商城</div>
      <a href="cart-demo.html" class="nav-btn"><i class="bi bi-bag-heart-fill"></i> 購物商城</a>
      <a href="stock/stocks.html" class="nav-btn"><i class="bi bi-graph-up-arrow"></i> 股票追蹤</a>

      <div class="nav-divider"></div>
      <div class="nav-label">系統</div>
      <a href="index.html#admin" class="nav-btn"><i class="bi bi-shield-lock-fill"></i> 後台管理</a>
      <a href="index.html#settings" class="nav-btn"><i class="bi bi-gear-fill"></i> 設定</a>
    </nav>
  </aside>

  <div class="main-content">
    <div class="gradient-wrap">
      <div class="wrap">
        <h1>記帳</h1>
        <div class="muted">選擇你想使用的記帳方式</div>

        <div class="grid">
          <div class="card st-g1" onclick="location.href='index.html#expense'">
            <i data-lucide="wallet" class="icon"></i>
            <div class="title">支出記帳</div>
            <div class="desc">輸入品項、分類與金額，快速新增一筆支出</div>
          </div>

          <div class="card st-g4" onclick="location.href='index.html#chatbook'">
            <i data-lucide="message-circle" class="icon"></i>
            <div class="title">聊天記帳</div>
            <div class="desc">像聊天一樣輸入：「早餐 65」，系統自動記錄</div>
          </div>

          <div class="card st-g5" onclick="location.href='index.html#camera'">
            <i data-lucide="camera" class="icon"></i>
            <div class="title">拍照記帳</div>
            <div class="desc">拍收據自動辨識金額與項目，省下手動輸入</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // 手機側邊欄控制
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    function toggleMenu() {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('show');
    }
    
    if(mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', toggleMenu);
      sidebarOverlay.addEventListener('click', toggleMenu);
    }
  </script>
</body>
</html>
